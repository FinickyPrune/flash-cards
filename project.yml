name: FlashCards

options:
  bundleIdPrefix: dev.finickyprune
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Generated test mocks (`@Mockable` protocols). Mock code is compiled only under the
  # MOCKING condition, which only the app's Debug config defines.
  Mockable:
    url: https://github.com/Kolos65/Mockable
    exactVersion: 0.6.4
  # Pure logic without UI or SwiftData (docs/architecture.md → Targets).
  FlashCore:
    path: Packages/FlashCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FlashCards:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
        type: syncedFolder
      - path: App/Resources
        type: syncedFolder
    dependencies:
      - package: Mockable
      - package: FlashCore
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MOCKING
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finickyprune.FlashCards
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  FlashCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
        type: syncedFolder
    dependencies:
      - target: FlashCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FlashCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
        type: syncedFolder
    dependencies:
      - target: FlashCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlashCards

schemes:
  FlashCards:
    build:
      targets:
        FlashCards: all
    test:
      targets:
        - FlashCardsTests
        - FlashCardsUITests
        - package: FlashCore/FlashCoreTests
      gatherCoverageData: true
      coverageTargets:
        - FlashCards
