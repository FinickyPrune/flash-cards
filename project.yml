name: FlashCards

options:
  bundleIdPrefix: dev.finickyprune
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FlashCards:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
        type: syncedFolder
      - path: App/Resources
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.finickyprune.FlashCards
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  FlashCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
        type: syncedFolder
    dependencies:
      - target: FlashCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FlashCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
        type: syncedFolder
    dependencies:
      - target: FlashCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FlashCards

schemes:
  FlashCards:
    build:
      targets:
        FlashCards: all
    test:
      targets:
        - FlashCardsTests
        - FlashCardsUITests
      gatherCoverageData: true
      coverageTargets:
        - FlashCards
